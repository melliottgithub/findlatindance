name: CI & Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild + deploy at 07:37 UTC to keep date windows and sitemaps fresh
    - cron: '37 7 * * *'

concurrency:
  group: deploy-latindance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  test-and-build:
    name: Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Production Static Build
        env:
          OUTPUT_MODE: export
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d out || (echo "Missing out directory!" && exit 1)
          test -f out/index.html || (echo "Missing out/index.html!" && exit 1)
          test -f out/festivals/index.html || (echo "Missing out/festivals/index.html!" && exit 1)
          test -f out/cities/miami/index.html || (echo "Missing out/cities/miami/index.html!" && exit 1)
          echo "Build verification passed!"

      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::037747827681:role/findbachata-github-deploy
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          aws s3 sync out/ s3://findlatindance-frontend-prod --delete

      - name: Invalidate CloudFront Cache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          aws cloudfront create-invalidation --distribution-id E2VSTCCNFCXZUV --paths "/*"

      - name: Post-deploy live smoke test
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          set -e
          for path in / /festivals /cities/miami; do
            ok=0
            for attempt in 1 2 3 4; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://findlatindance.com$path")
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "smoke: $path -> HTTP $code (attempt $attempt), retrying in 10s..."
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "SMOKE FAIL: $path never returned 200"; exit 1; }
            echo "smoke OK: $path"
          done

      - name: Notify on failure (GitHub issue -> email)
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="FindLatinDance Deploy Pipeline failing on main"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          body="Run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (trigger: $GITHUB_EVENT_NAME, $(date -u +%Y-%m-%dT%H:%MZ))"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
