name: CI & Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    name: Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Production Static Build
        env:
          OUTPUT_MODE: export
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d out || (echo "Missing out directory!" && exit 1)
          test -f out/index.html || (echo "Missing out/index.html!" && exit 1)
          test -f out/festivals/index.html || (echo "Missing out/festivals/index.html!" && exit 1)
          test -f out/cities/miami/index.html || (echo "Missing out/cities/miami/index.html!" && exit 1)
          echo "Build verification passed!"

      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::037747827681:role/findbachata-github-deploy
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync out/ s3://findlatindance-frontend-prod --delete

      - name: Invalidate CloudFront Cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation --distribution-id E2VSTCCNFCXZUV --paths "/*"
