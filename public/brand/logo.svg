<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldLuxury" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#926f21" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Scrim -->
  <rect width="100" height="100" rx="20" fill="#070709" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Interlocking Calligraphic 'L' -->
  <path d="M36 24 C38 36, 40 54, 42 66 C42 70, 48 76, 68 76 C75 76, 80 73, 82 71" 
        stroke="url(#goldLuxury)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#goldGlow)" />

  <!-- Interlocking Calligraphic 'D' Arch -->
  <path d="M42 34 C58 22, 78 30, 78 50 C78 68, 56 75, 42 70" 
        stroke="url(#goldLuxury)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Upward Dynamic Ascender -->
  <path d="M30 38 C32 26, 40 18, 50 18" 
        stroke="url(#goldLuxury)" 
        stroke-width="4.5" 
        stroke-linecap="round" />
</svg>
